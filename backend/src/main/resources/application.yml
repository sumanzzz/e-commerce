spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudcart}
    username: ${DATABASE_USER:cloudcart}
    password: ${DATABASE_PASSWORD:cloudcart}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deployment-0123456789}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
